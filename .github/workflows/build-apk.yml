name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply brand dropdown to normal product editor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/pl/mmarkowebuty/admin/ui/AdminApp.kt')
          text = path.read_text(encoding='utf-8')

          import_line = 'import pl.mmarkowebuty.admin.batch.ManufacturerProfiles\n'
          anchor_import = 'import pl.mmarkowebuty.admin.MainViewModel\n'
          if import_line not in text:
              if anchor_import not in text:
                  raise SystemExit('MainViewModel import anchor not found')
              text = text.replace(anchor_import, anchor_import + import_line, 1)

          state_line = '    var brandMenuExpanded by remember(product?.id) { mutableStateOf(false) }\n'
          brand_state = '    var brand by remember(product?.id) { mutableStateOf(product?.brand ?: "") }\n'
          if state_line not in text:
              if brand_state not in text:
                  raise SystemExit('brand state anchor not found')
              text = text.replace(brand_state, brand_state + state_line, 1)

          old = '        AppField("Marka", brand, { brand = it }, enabled = !sold)'
          new = '''        ExposedDropdownMenuBox(
              expanded = brandMenuExpanded,
              onExpandedChange = { if (!sold) brandMenuExpanded = !brandMenuExpanded }
          ) {
              OutlinedTextField(
                  value = brand,
                  onValueChange = { brand = it },
                  modifier = Modifier.menuAnchor().fillMaxWidth(),
                  enabled = !sold,
                  singleLine = true,
                  label = { Text("Marka") },
                  trailingIcon = { ExposedDropdownMenuDefaults.TrailingIcon(expanded = brandMenuExpanded) }
              )
              ExposedDropdownMenu(
                  expanded = brandMenuExpanded,
                  onDismissRequest = { brandMenuExpanded = false }
              ) {
                  ManufacturerProfiles.all.forEach { profile ->
                      DropdownMenuItem(
                          text = { Text(profile.brand) },
                          onClick = {
                              brandMenuExpanded = false
                              brand = profile.brand
                              manufacturerName = profile.manufacturerName
                              manufacturerAddress = profile.manufacturerAddress
                              manufacturerEmail = profile.manufacturerEmail
                          }
                      )
                  }
              }
          }'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'ManufacturerProfiles.all.forEach { profile ->' not in text:
              raise SystemExit('Marka field anchor not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit product editor update
        run: |
          if ! git diff --quiet -- app/src/main/java/pl/mmarkowebuty/admin/ui/AdminApp.kt; then
            git config user.name "mMarkoweButy CI"
            git config user.email "actions@users.noreply.github.com"
            git add app/src/main/java/pl/mmarkowebuty/admin/ui/AdminApp.kt
            git commit -m "Add manufacturer dropdown to product editor"
            git push origin HEAD:main
          fi

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mMarkoweButy-Admin-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
