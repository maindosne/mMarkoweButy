name: Wieza z gratow 0.4.0 Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ci/wieza-project/**'
      - '.github/workflows/wieza-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Restore Java source
        run: |
          mkdir -p ci/wieza-project/app/src/main/java/pl/marek/zlomiarz
          cat ci/wieza-project/java/part00.b64 ci/wieza-project/java/part01.b64 ci/wieza-project/java/part02.b64 ci/wieza-project/java/part03.b64 ci/wieza-project/java/part04.b64 ci/wieza-project/java/part05.b64 | base64 -d > ci/wieza-project/app/src/main/java/pl/marek/zlomiarz/MainActivity.java
          echo "1cb960099fe8ac2167d256a8dd3cc39d26bd1eeb21b3fd465e0c801d718fe09f  ci/wieza-project/app/src/main/java/pl/marek/zlomiarz/MainActivity.java" | sha256sum -c -
      - name: Build unsigned release APK
        working-directory: ci/wieza-project
        run: gradle :app:assembleRelease --no-daemon
      - name: Align APK and collect signing tool
        run: |
          mkdir -p /tmp/wieza-out/lib
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -f 4 ci/wieza-project/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/wieza-out/Wieza-z-gratow-0.4.0-aligned-unsigned.apk
          cp "$BT/apksigner" /tmp/wieza-out/
          cp "$BT/lib/apksigner.jar" /tmp/wieza-out/lib/
      - uses: actions/upload-artifact@v4
        with:
          name: wieza-z-gratow-0.4.0-build
          path: /tmp/wieza-out
          if-no-files-found: error
